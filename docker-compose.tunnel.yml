# โปรไฟล์ production ผ่าน Cloudflare Tunnel — ใช้คู่กับ docker-compose.yml
#
# ตั้ง COMPOSE_FILE ใน .env เป็น
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tunnel.yml
# แล้วสั่ง `docker compose up -d --build` ตามปกติ
#
# ใช้ไฟล์นี้แทน docker-compose.prod.yml เมื่อรันจากโน้ตบุ๊ก/เครื่องที่บ้าน
# ซึ่งไม่มี IP สาธารณะคงที่ และเปิด port 80/443 เข้ามาจากภายนอกไม่ได้
# (ISP ไทยส่วนใหญ่ใช้ CGNAT)
#
# หลักการ: cloudflared เปิดการเชื่อมต่อ "ขาออก" ไปหา Cloudflare แล้ว
# Cloudflare ส่ง traffic ของ app.recommendation.site ย้อนกลับมาตามท่อนั้น
# จึงไม่ต้อง forward port ที่เราเตอร์เลย และไม่ต้องมี IP สาธารณะ
#
# TLS ถูก terminate ที่ Cloudflare — เบราว์เซอร์เห็นเป็น https ของจริง
# cookie จึงติดธง Secure ได้ตามปกติ (ดู APP_COOKIE_SECURE ด้านล่าง)
# ไม่ต้องใช้ Caddy เพราะ Cloudflare ทำหน้าที่นี้แทนหมดแล้ว

services:
  postgres:
    ports: !override []

  resume-service:
    ports: !override []

  backend:
    environment:
      # เบราว์เซอร์คุยกับ Cloudflare ผ่าน https จึงติดธง Secure ได้
      APP_COOKIE_SECURE: "true"
      APP_COOKIE_SAME_SITE: Lax
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://app.recommendation.site}
      # Spring ต้องเชื่อ X-Forwarded-Proto ที่ cloudflared ส่งมา ไม่งั้นจะ
      # เข้าใจว่า request เป็น http แล้วอาจไม่ยอมส่ง cookie ที่ติดธง Secure
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    # คงการเปิด 8080 ไว้ที่เครื่องตัวเอง เพื่อให้เข้า Swagger ตอนพัฒนาได้สะดวก
    # (เข้าถึงได้เฉพาะในเครื่อง/วง LAN ไม่ได้เปิดออกอินเทอร์เน็ต เพราะไม่มี
    #  การ forward port ที่เราเตอร์ และ Tunnel ไม่ได้ผูกกับ port นี้)
    # ถ้าย้ายขึ้นเซิร์ฟเวอร์จริงที่มี IP สาธารณะ ให้ใช้ docker-compose.prod.yml
    # ซึ่งปิด port ทั้งหมดไว้แล้ว

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        BACKEND_INTERNAL_URL: http://backend:8080
    # คงการเปิด 3000 ไว้ เพื่อให้เข้า http://localhost:3000 ตอนพัฒนาได้เหมือนเดิม

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - frontend
    # token ได้จากหน้า Cloudflare Zero Trust → Networks → Tunnels
    # ตอนสร้าง tunnel (เลือกวิธีติดตั้งแบบ Docker แล้วก๊อป token จากคำสั่งที่ให้มา)
    # ⚠️ token นี้เท่ากับกุญแจเข้าเครือข่าย — เก็บใน .env เท่านั้น ห้าม commit
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
