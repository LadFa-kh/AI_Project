spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ---------------------------------------------------------------
# File upload limits (multipart)
# ---------------------------------------------------------------
# These were previously unset, so Spring fell back to its default
# max-file-size of 1MB, while the web UI (frontend/lib/validators.ts and the
# "max 5MB" chip on the upload card) let files up to 5MB through. Any file
# between 1MB and 5MB -- a scanned PDF, typically -- was rejected by Tomcat
# midway through the upload. Aligned with what the UI advertises.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# When a file exceeds the limit, Tomcat stops reading the request body and
# closes the connection before the browser has finished sending. The browser
# is then left waiting for a response that never arrives (cloudflared logs it
# as "use of closed network connection"). Setting this to -1 makes Tomcat
# drain the rest of the body first, so the 413 response is actually delivered
# and the user sees the error message instead of a spinner that never stops.
server.tomcat.max-swallow-size=-1

# ---------------------------------------------------------------
# อายุ access token (มิลลิวินาที)
# ---------------------------------------------------------------
# ใช้ร่วมกันระหว่าง JwtTokenProvider (อายุใน JWT) และ CookieUtil (maxAge ของ
# cookie) เพื่อไม่ให้สองค่าหลุดจากกัน เดิมฝังไว้ในโค้ดที่ 900000 (15 นาที)
# ทำให้ผู้ใช้หลุดออกจากระบบระหว่างใช้งานบ่อยมาก เพราะ refresh token ยังไม่ได้
# ต่อเข้ากับ flow การล็อกอินจริง
# 86400000 = 1 วัน
app.jwt.access-token-expiration-ms=86400000

# ===================== B1–B10 (ค่าทั้งหมดมีค่าเริ่มต้นในโค้ดแล้ว ลบบรรทัดไหนก็ยังรันได้) =====================
# B2: จับคู่ทักษะแบบเข้าใจความหมายด้วย LLM (false = ใช้แบบคำอย่างเดียวเหมือนเดิม)
app.matching.semantic.enabled=true
# B3: เวลาที่ตัวตั้งเวลาเปิด/ปิดประกาศงาน (ทุกชั่วโมง นาทีที่ 5 เวลาไทย)
app.jobs.status-cron=0 5 * * * *
# B8: เครดิตต่อเดือนต่อผู้ใช้ (0 = ไม่จำกัด) และค่าใช้ต่อครั้ง
app.credits.monthly-limit=30
app.credits.cost.RESUME_UPLOAD=1
app.credits.cost.ASSESSMENT_SUBMIT=1
# B9: นโยบายความเป็นส่วนตัว — เปลี่ยน version เมื่อแก้นโยบาย ผู้ใช้ทุกคนต้องกดยอมรับใหม่
app.policy.version=1.0
app.policy.url=/privacy-policy
app.policy.effective-date=2026-09-24
# true = สมัครสมาชิกต้องส่ง acceptedPolicyVersion (เปิดหลังหน้าบ้านเพิ่ม checkbox แล้วเท่านั้น)
app.policy.enforce-on-register=false
app.retention.usage-log-days=365
# B10: rate limit ต่อ IP ต่อนาที
app.ratelimit.enabled=true
app.ratelimit.auth-per-minute=10
app.ratelimit.ai-per-minute=6
app.ratelimit.import-per-minute=5
# Cost per action: ราคา LLM ต่อ 1 ล้าน token — ใส่ตามหน้าราคาของ CometAPI สำหรับโมเดลที่ใช้ (ยังเป็น 0 = ยังไม่ได้ตั้ง)
app.llm.price.input-per-1m=0
app.llm.price.output-per-1m=0
app.llm.price.currency=USD
