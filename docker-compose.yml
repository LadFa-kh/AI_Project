services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  resume-service:
    build:
      context: .
      dockerfile: main-py.Dockerfile
    restart: unless-stopped
    environment:
      COMET_API_KEY: ${COMET_API_KEY}
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      resume-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # ชื่อ property จริงคือ fastapi.base.url (ไม่ใช่ NLP_SERVICE_URL)
      # และต้องชี้ไป resume-service เพราะ service เปลี่ยนชื่อจาก fastapi-ai แล้ว
      FASTAPI_BASE_URL: http://resume-service:8000
      JWT_SECRET: ${JWT_SECRET}
      # ตัวนี้ไม่มีค่า default ในโค้ด — ถ้าไม่ใส่ backend จะ start ไม่ขึ้นเลย
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      # ไฟล์นี้คือโปรไฟล์ dev (http://localhost) — cookie ต้องไม่ติดธง Secure
      # ไม่งั้นเบราว์เซอร์จะทิ้ง cookie ทันทีเพราะไม่ได้วิ่งบน HTTPS
      # โปรไฟล์ production อยู่ใน docker-compose.prod.yml (Secure=true)
      #
      # SameSite=Lax ใช้ได้ทั้ง dev และ prod เพราะ frontend เรียก API ผ่าน
      # proxy ของตัวเอง (same-origin) ไม่ได้ยิงข้าม origin แล้ว
      APP_COOKIE_SECURE: "false"
      APP_COOKIE_SAME_SITE: Lax
      # origin ที่อนุญาตให้เรียกตรง (ไม่ผ่าน proxy) — เหลือไว้ให้ Swagger UI
      # และการเทสด้วย Postman เท่านั้น
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
      args:
        # ตั้งเป็น /api/v1 (path ล้วน ไม่มีโดเมน) — เบราว์เซอร์จะยิงมาที่ origin
        # เดียวกับหน้าเว็บ แล้ว Next.js rewrites proxy ต่อไปให้ (next.config.ts)
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        # ปลายทางของ proxy — ชื่อ service ภายในเครือข่าย Docker
        BACKEND_INTERNAL_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data: